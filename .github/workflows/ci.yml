name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the uv-pre-commit rev in .pre-commit-config.yaml.
  UV_VERSION: "0.11.2"

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact tag on purpose: astral-sh/setup-uv publishes
        # floating major aliases only up to v7, so @v10 does not resolve.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Pin where `uv tool install` puts binaries rather than assuming
          # uv's per-platform default, so the PATH line below cannot drift.
          tool-bin-dir: ${{ runner.temp }}/uv-tools

      - name: Install just
        run: |
          uv tool install rust-just
          echo "${{ runner.temp }}/uv-tools" >> "$GITHUB_PATH"

      - name: Install the project
        run: uv sync --locked

      # The same recipes a developer runs locally. If CI needs a step that is
      # not a recipe, add the recipe instead of inlining it here.
      - run: just lint
      - run: just typecheck
      - run: just test

  hooks:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact tag on purpose: astral-sh/setup-uv publishes
        # floating major aliases only up to v7, so @v10 does not resolve.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Run every hook against every file
        run: uv run pre-commit run --all-files --show-diff-on-failure
