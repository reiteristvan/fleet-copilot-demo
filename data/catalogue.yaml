# The machine catalogue every document in the corpus draws its nouns from.
#
# Machine names and codes are invented. The shapes are not: item numbers follow
# the manufacturer's real N.NNN-NNN.N format and error codes follow E-NNN,
# because those are exactly the tokens a retriever is most likely to split on,
# and a corpus that used simpler shapes would not exercise the case that breaks.
#
# Validated by fleet_copilot.corpus.models.Catalogue on load. Item numbers are
# unique across the whole file, and every code in applies_to must name a machine
# type declared here.

