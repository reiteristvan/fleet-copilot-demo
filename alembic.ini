# Alembic configuration.
#
# Deliberately minimal. There is no sqlalchemy.url here: migrations/env.py reads
# DATABASE_URL through the application's own Settings, so the migrations and the
# API cannot end up pointed at different databases because two files drifted.

[alembic]
script_location = migrations
prepend_sys_path = .

# Version files sort by their filename, so the date prefix keeps them in the
# order they were written rather than in hash order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
