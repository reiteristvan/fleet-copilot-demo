[project]
name = "fleet-copilot"
version = "0.1.0"
description = "End-to-end AI pipeline demo: ingest, retrieval, agents, evals and API."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "reiteristvan", email = "reiteristvan@gmail.com" }]
dependencies = [
    "azure-identity>=1.19",
    "fastapi>=0.141.1",
    "httpx2>=2.13.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
fleet-copilot = "fleet_copilot.api.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    # Corpus generation (src/fleet_copilot/corpus). Dev-only on purpose: the API
    # image installs with --no-dev, and nothing in the request path reads these.
    "azure-storage-blob>=12.24",
    "fpdf2>=2.8",
    "pillow>=11.0",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

# --------------------------------------------------------------------------- #
# Lint + format (ruff)
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F are ruff's defaults; the rest are the sets this project commits to.
select = [
    "ASYNC", # flake8-async  - blocking calls in async code
    "B",     # flake8-bugbear
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["fleet_copilot"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# Types (mypy --strict)
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
